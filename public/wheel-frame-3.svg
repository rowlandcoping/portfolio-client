<svg width="12" height="48" viewBox="0 0 12 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="wheelGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#999"/>
      <stop offset="50%" stop-color="#666"/>
      <stop offset="100%" stop-color="#333"/>
    </radialGradient>
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset dx="0" dy="1"/>
      <feGaussianBlur stdDeviation="1" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.2" result="shadow"/>
      <feComposite operator="in" in="shadow" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="12" height="48" rx="6" fill="url(#wheelGradient)" filter="url(#innerShadow)"/>

  <line x1="2" y1="5" x2="10" y2="5" stroke="#444" stroke-width="1"/>
  <line x1="2" y1="13" x2="10" y2="13" stroke="#444" stroke-width="1"/>
  <line x1="2" y1="21" x2="10" y2="21" stroke="#444" stroke-width="1"/>
  <line x1="2" y1="29" x2="10" y2="29" stroke="#444" stroke-width="1"/>
  <line x1="2" y1="37" x2="10" y2="37" stroke="#444" stroke-width="1"/>
  <line x1="2" y1="45" x2="10" y2="45" stroke="#444" stroke-width="1"/>
</svg>
